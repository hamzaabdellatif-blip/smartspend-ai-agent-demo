<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartSpend AI Agent</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  </style>
</head>
<body>
  <iframe
    src="/en"
    title="SmartSpend AI Agent"
    allow="clipboard-read; clipboard-write; microphone; camera; fullscreen"
    allowfullscreen
    referrerpolicy="no-referrer"></iframe>
  <script>
    // The iframe is same-origin (Ziila is proxied through our domain), so we can style it.
    // public/assets/images/logos/zilla-fullcolor-logo.svg already blanks the image; this collapses its space.
    var frame = document.querySelector('iframe');
    frame.addEventListener('load', function () {
      try {
        var doc = frame.contentDocument;
        if (doc.getElementById('ss-overrides')) return;
        var style = doc.createElement('style');
        style.id = 'ss-overrides';
        style.textContent = 'img[src*="/logos/zilla-fullcolor-logo.svg"]{display:none!important}';
        doc.head.appendChild(style);
      } catch (e) {}
    });
  </script>
</body>
</html>
